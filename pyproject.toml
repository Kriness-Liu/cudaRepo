[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cudarepo"
version = "0.1.0"
description = "Learn CUDA execution and performance engineering with NVRTC and PyTorch tensors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cuda = ["torch>=2.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

